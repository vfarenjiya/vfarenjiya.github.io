<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>GATE Quest — DA 2027</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="insta.css">
</head>
<body>
<canvas id="fx"></canvas>

<header class="topbar">
  <div class="logo">GATE Quest</div>
  <div class="top-actions">
    <span class="pill" id="tbStreak">🔥 0</span>
    <span class="pill" id="tbCoins">🪙 0</span>
    <button class="iconbtn" id="themeBtn" title="Theme">🌙</button>
    <button class="iconbtn" id="installBtn" title="Install">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar">
    <div class="logo side-logo">GATE Quest</div>
    <button class="navitem" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span></button>
    <button class="navitem" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><span class="navbadge" data-due hidden></span></button>
    <button class="navitem" data-tab="arena"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span>Arena</span></button>
    <button class="navitem" data-tab="reels"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M8 3l3 5M14 3l3 5"/><path d="M10 12.5v5l4.5-2.5z"/></svg><span>Reels</span></button>
    <button class="navitem" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg><span>Profile</span></button>
  </nav>

  <main class="main">
    <section id="view-home" class="tabview">
      <div class="stories" id="stories"></div>
      <div class="homerow">
        <div class="feedcol"><div id="feedList"></div><div class="feedend hint" id="feedEnd"></div></div>
        <aside class="rail" id="rail"></aside>
      </div>
    </section>

    <section id="view-search" class="tabview hidden">
      <div class="searchbar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchBox" placeholder="Search"></div>
      <div class="gridtabs">
        <button class="gtab on" data-g="all">All</button>
        <button class="gtab" data-g="ps">PS</button><button class="gtab" data-g="la">LA</button>
        <button class="gtab" data-g="co">CO</button><button class="gtab" data-g="pdsa">DSA</button>
        <button class="gtab" data-g="dbms">DBMS</button><button class="gtab" data-g="ml">ML</button><button class="gtab" data-g="ai">AI</button>
      </div>
      <div class="explore" id="exploreGrid"></div>
    </section>

    <section id="view-arena" class="tabview hidden"><div id="arenaContainer"></div></section>
    <section id="view-reels" class="tabview hidden"><div class="reelswrap" id="reelsWrap"></div></section>

    <section id="view-profile" class="tabview hidden">
      <div class="phead">
        <div class="pava"><div class="pava-in" id="pAva">⚡</div></div>
        <div class="pstats">
          <div><b id="pTopics">0</b><span>topics</span></div>
          <div><b id="pXP">0</b><span>XP</span></div>
          <div><b id="pStreak">0</b><span>streak</span></div>
          <div><b id="pCoins">0</b><span>coins</span></div>
        </div>
      </div>
      <div class="pbio"><b id="pTitle">Fresher</b> · LVL <span id="pLvl">1</span><br><span class="hint">GATE DA 2027 · IIT Madras · <span id="pDays">—</span></span></div>
      <div class="highlights" id="highlights"></div>
      <div class="ptabs">
        <button class="ptab on" data-p="grid">▦</button>
        <button class="ptab" data-p="saved">🔖</button>
        <button class="ptab" data-p="ach">🏆</button>
      </div>
      <div class="explore" id="profileGrid"></div>
      <div class="settings">
        <label class="hint">Exam day <input type="date" id="examDate"></label>
        <button id="themeToggleBtn">🌓 Theme</button><button id="fontMinusBtn">A−</button><button id="fontPlusBtn">A+</button>
        <button id="exportBtn">💾 Export</button><button id="importBtn">📂 Import</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <button id="installBtn2">📲 Install</button>
        <button id="resetBtn" class="danger">Reset all</button>
      </div>
    </section>
  </main>
</div>

<nav class="bottomnav">
  <button class="navitem" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
  <button class="navitem" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="navbadge" data-due hidden></span></button>
  <button class="navitem" data-tab="arena"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></button>
  <button class="navitem" data-tab="reels"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M8 3l3 5M14 3l3 5"/><path d="M10 12.5v5l4.5-2.5z"/></svg></button>
  <button class="navitem" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></button>
</nav>

<div class="sheetwrap hidden" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="mock.js"></script>
</body>
</html>
