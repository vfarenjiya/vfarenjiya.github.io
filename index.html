<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Snake RL — AI Snake Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --accent: #0f9d58;
            --accent2: #e94560;
            --text: #eaeaea;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            overscroll-behavior: none;
            height: 100%;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: calc(10px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
            user-select: none;
            -webkit-user-select: none;
        }

        header { width: 100%; max-width: 480px; text-align: center; margin-bottom: 8px; }
        h1 { font-size: 1.4rem; letter-spacing: 1px; }
        h1 span { color: var(--accent); }

        #offlineBadge {
            display: none; font-size: .7rem; background: var(--accent2);
            padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle;
        }

        .modes { display: flex; gap: 6px; width: 100%; max-width: 480px; margin-bottom: 10px; }
        .modes button {
            flex: 1; padding: 10px 4px; border: none; border-radius: 10px;
            background: var(--panel); color: var(--text); font-size: .85rem;
            font-weight: 600; cursor: pointer; transition: background .2s;
        }
        .modes button.active { background: var(--accent); color: #fff; }

        .game-wrap {
            position: relative; width: 100%; max-width: 480px;
            aspect-ratio: 1 / 1; background: var(--panel);
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.4);
            touch-action: none;
        }
        canvas#gameCanvas { width: 100%; height: 100%; display: block; }

        .hud {
            position: absolute; top: 8px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 14px;
            font-weight: 700; font-size: .95rem; pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,.6);
        }

        /* On-screen D-pad */
        .dpad {
            display: grid; grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 56px); gap: 6px; margin-top: 14px;
        }
        .dpad button {
            border: none; border-radius: 12px; background: var(--panel);
            color: var(--text); font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background .1s, transform .1s;
        }
        .dpad button:active { background: var(--accent); transform: scale(.95); }
        .dpad .empty { visibility: hidden; }

        .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
        .controls button {
            padding: 12px 18px; border: none; border-radius: 12px;
            background: var(--accent); color: #fff; font-weight: 700;
            font-size: .95rem; cursor: pointer; min-width: 90px;
        }
        .controls button.secondary { background: var(--panel); }
        .controls button:disabled { opacity: .4; }

        .stats {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; width: 100%; max-width: 480px; margin-top: 14px;
        }
        .stat { background: var(--panel); border-radius: 10px; padding: 10px 4px; text-align: center; }
        .stat .label { font-size: .65rem; text-transform: uppercase; opacity: .6; }
        .stat .value { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

        #trainPanel {
            display: none; width: 100%; max-width: 480px; margin-top: 14px;
            background: var(--panel); border-radius: 12px; padding: 14px;
        }
        #trainPanel.show { display: block; }
        #trainPanel h3 { font-size: .9rem; margin-bottom: 8px; }
        canvas#chart { width: 100%; height: 120px; background: #0d1226; border-radius: 8px; }
        .train-stats { display: flex; justify-content: space-between; margin-top: 8px; font-size: .8rem; }
        .train-stats b { color: var(--accent); }

        .progress-bar { height: 6px; background: #0d1226; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }

        #installBtn {
            display: none; position: fixed; bottom: calc(16px + var(--safe-bottom));
            left: 50%; transform: translateX(-50%); padding: 12px 24px;
            background: var(--accent2); color: #fff; border: none; border-radius: 24px;
            font-weight: 700; cursor: pointer; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,.5);
        }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--panel); padding: 10px 20px; border-radius: 20px;
            font-size: .85rem; opacity: 0; transition: opacity .3s; pointer-events: none;
            border: 1px solid var(--accent); z-index: 99;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <header>
        <h1>🐍 SNAKE <span>RL</span><span id="offlineBadge">OFFLINE</span></h1>
    </header>

    <div class="modes">
        <button data-mode="human" class="active">👤 Play</button>
        <button data-mode="ai">🤖 Watch AI</button>
        <button data-mode="train">🧠 Train AI</button>
    </div>

    <div class="game-wrap" id="gameWrap">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <span>Score: <b id="hudScore">0</b></span>
            <span>Best: <b id="hudBest">0</b></span>
        </div>
    </div>

    <div class="dpad" id="dpad">
        <button class="empty"></button>
        <button data-dir="UP">▲</button>
        <button class="empty"></button>
        <button data-dir="LEFT">◀</button>
        <button class="empty"></button>
        <button data-dir="RIGHT">▶</button>
        <button class="empty"></button>
        <button data-dir="DOWN">▼</button>
        <button class="empty"></button>
    </div>

    <div class="controls">
        <button id="startBtn">▶ Start</button>
        <button id="pauseBtn" class="secondary">⏸ Pause</button>
        <button id="resetBtn" class="secondary">↺ Reset</button>
        <button id="saveBtn" class="secondary">💾 Save</button>
    </div>

    <div class="stats">
        <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
        <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
        <div class="stat"><div class="label">Games</div><div class="value" id="games">0</div></div>
        <div class="stat"><div class="label">Avg</div><div class="value" id="avg">0</div></div>
    </div>

    <div id="trainPanel">
        <h3>🧠 Training Progress</h3>
        <canvas id="chart"></canvas>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="train-stats">
            <span>Episode: <b id="episode">0</b></span>
            <span>ε: <b id="epsilon">1.000</b></span>
            <span>Avg Reward: <b id="avgReward">0</b></span>
        </div>
    </div>

    <button id="installBtn">📲 Install App</button>
    <div class="toast" id="toast"></div>

    <script src="snake-game.js"></script>
    <script src="q-learning.js"></script>
    <script src="app.js"></script>
</body>
</html>
