<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#e8a23d"/>
      <stop offset="0.5" stop-color="#f6c445"/>
      <stop offset="1"   stop-color="#35d07f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- true-black squircle to match the IG theme -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- subtle inner ring -->
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="#262626" stroke-width="4"/>

  <!-- bolt, kept inside the maskable safe zone (≈ center 80%) -->
  <path d="M296 108 L196 276 h58 l-22 128 L344 224 h-58 z"
        fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>